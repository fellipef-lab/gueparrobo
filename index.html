<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atividades">
<title>Controle de Atividades</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #f3f5f8; --card: #ffffff; --text: #17212b; --muted: #637083; --line: #e1e6ed;
    --primary: #0e7c66; --primary-2: #e3f4ef; --primary-text: #fff;
    --ok: #1a7f37; --ok-bg: #e6f6ea; --warn: #9a6700; --warn-bg: #fff6d6;
    --bad: #c62828; --bad-bg: #fdecec; --info: #1f6feb; --info-bg: #e3edff; --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141a; --card: #18202a; --text: #e8edf3; --muted: #93a1b3; --line: #2a3542;
      --primary: #2bb594; --primary-2: #143229; --ok: #4fc26a; --ok-bg: #16301d;
      --warn: #e3b341; --warn-bg: #33290f; --bad: #ff6b6b; --bad-bg: #3a1a1a; --info: #6ea2ff; --info-bg: #1b2b4a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  a { color: var(--primary); }
  header {
    position: sticky; top: 0; z-index: 500; background: var(--primary); color: var(--primary-text);
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { font-size: 18px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hBtns { display: flex; gap: 6px; }
  #hBtns button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .demo-bar { background: #fff6d6; color: #6b4a00; font-size: 13px; text-align: center; padding: 6px 12px; border-bottom: 1px solid #e8d48a; }
  .demo-bar button { margin-left: 8px; border: 1px solid #c9a227; background: #fff; color: #6b4a00; border-radius: 8px; padding: 3px 9px; font-size: 12px; cursor: pointer; font-family: inherit; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; padding-bottom: 40px; }
  main.largo { max-width: 1280px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 16px 0 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 12px; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px 14px; font-size: 16px; font-weight: 600;
    background: var(--primary); color: var(--primary-text); cursor: pointer; text-align: center; text-decoration: none; font-family: inherit;
  }
  .btn.sec { background: transparent; color: var(--primary); border: 1px solid var(--line); }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.bad { background: var(--bad); color: #fff; }
  .btn.warn { background: var(--warn); color: #fff; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn + .btn, .btn + p { margin-top: 10px; }
  .linha-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .linha-btns .btn { width: auto; flex: 1 1 180px; margin: 0; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  input, select, textarea {
    width: 100%; padding: 11px 12px; font-size: 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); margin-bottom: 10px; font-family: inherit;
  }
  textarea { min-height: 70px; resize: vertical; }
  label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 4px; }
  .campo-agora { display: flex; gap: 6px; }
  .campo-agora input { flex: 1 1 auto; min-width: 0; }
  .campo-agora button { margin-bottom: 10px; flex: none; padding: 0 9px; }
  @media (max-width: 420px) { .row.horas { flex-direction: column; gap: 0; } }
  .list { list-style: none; margin: 0; padding: 0; }
  .item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .item:first-child { border-top: 0; }
  .item .info { flex: 1; min-width: 180px; }
  .item .title { font-weight: 600; overflow-wrap: anywhere; }
  .item .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; vertical-align: middle; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.off { background: var(--line); color: var(--muted); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.azul { background: var(--info-bg); color: var(--info); }
  .mini { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 9px; padding: 7px 10px; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none; font-family: inherit; }
  .mini.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
  .mini.pri { background: var(--primary); color: #fff; border-color: var(--primary); }
  .mini.del { color: var(--bad); }
  .alert { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px; }
  .alert b { display: block; margin-bottom: 2px; }
  .alert.info { background: var(--info-bg); color: var(--info); border-color: var(--info); }
  .empty { text-align: center; color: var(--muted); padding: 18px 0; }
  .center { text-align: center; }
  .hidden { display: none !important; }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #18202b; color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: calc(100% - 32px); z-index: 2000; text-align: center; }
  .toast.show { opacity: 1; }
  .ocupado { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1900; display: flex; align-items: center; justify-content: center; }
  .ocupado div { background: var(--card); color: var(--text); padding: 18px 22px; border-radius: 14px; font-weight: 600; max-width: 80%; text-align: center; }
  .olho { position: absolute; right: 4px; top: calc(50% - 5px); transform: translateY(-50%); border: 0; background: transparent; font-size: 20px; line-height: 1; padding: 8px; cursor: pointer; }
  .senha { position: relative; }
  .senha input { padding-right: 46px; }

  /* Janela (modal) */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1500; display: flex; align-items: flex-end; justify-content: center; }
  .modal .sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 600px) { .modal { align-items: center; } .modal .sheet { border-radius: 18px; } }

  /* Menu: embaixo no celular, na lateral no computador */
  .menu { position: fixed; left: 0; right: 0; bottom: 0; z-index: 400; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .menu button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 8px 2px 9px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: inherit; }
  .menu button .ic { font-size: 21px; line-height: 1.1; }
  .menu button.on { color: var(--primary); }
  main.largo { padding-bottom: 90px; }
  @media (min-width: 1000px) {
    main.largo { padding: 22px 24px 40px; }
    .painel { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px; align-items: start; }
    .menu { position: sticky; top: 84px; flex-direction: column; gap: 4px; background: transparent; border: 0; padding: 0; }
    .menu button { flex: none; flex-direction: row; gap: 10px; font-size: 15px; padding: 12px 14px; border-radius: 10px; color: var(--text); text-align: left; }
    .menu button .ic { font-size: 18px; }
    .menu button:hover:not(.on) { background: var(--card); }
    .menu button.on { background: var(--primary); color: #fff; }
    .toast { bottom: 24px; }
  }

  /* Indicadores */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--cor, var(--primary)); border-radius: var(--radius); padding: 12px 14px; }
  .kpi .n { font-size: 26px; font-weight: 800; line-height: 1.15; color: var(--cor, var(--text)); }
  .kpi .t { font-size: 13px; font-weight: 700; }
  .kpi .s { font-size: 12px; color: var(--muted); }
  /* no celular, os indicadores ficam numa faixa que desliza para o lado */
  @media (max-width: 599px) {
    .kpis { display: flex; overflow-x: auto; scroll-snap-type: x proximity; margin: 0 -16px 14px; padding: 0 16px 4px; -webkit-overflow-scrolling: touch; }
    .kpi { flex: 0 0 128px; scroll-snap-align: start; padding: 10px 12px; }
    .kpi .n { font-size: 22px; }
    .kpi .s { display: none; }
  }

  /* Dia */
  .navdia { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .navdia input { width: auto; flex: 1 1 160px; margin: 0; }
  .navdia .mini { padding: 10px 12px; }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filtros button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 99px; padding: 6px 12px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .filtros button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .grupo-tit { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .ativ { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--cor, var(--line)); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .ativ .topo { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  .ativ .local { font-weight: 800; }
  .ativ .pessoas { font-weight: 600; }
  .ativ .nums { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .ativ .nums b { color: var(--text); }
  .ativ .obs { font-size: 14px; margin-top: 6px; color: var(--text); background: var(--bg); border-radius: 8px; padding: 6px 10px; }
  .ativ .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .ativ .acts .mini { padding: 9px 12px; }
  .sem-reg { display: flex; flex-wrap: wrap; gap: 6px; }
  @media (min-width: 1000px) {
    .grade-ativ { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 10px; }
    .grade-ativ .ativ { margin: 0; display: flex; flex-direction: column; }
    .grade-ativ .ativ .acts { margin-top: auto; padding-top: 10px; }
  }

  /* Chips de colaboradores */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; max-height: 260px; overflow-y: auto; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 99px; padding: 7px 12px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .calc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 4px 0 12px; }
  .calc div { background: var(--primary-2); border-radius: 10px; padding: 8px; text-align: center; }
  .calc b { display: block; font-size: 18px; }
  .calc span { font-size: 11px; color: var(--muted); }

  /* Tabelas */
  .tabela-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.tab { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tab th, .tab td { border-bottom: 1px solid var(--line); padding: 8px 8px; text-align: right; white-space: nowrap; }
  .tab th { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .tab th:first-child, .tab td:first-child, .tab .esq { text-align: left; }
  .tab tr.total td { font-weight: 800; border-top: 2px solid var(--text); }
  .tab td.pend { color: var(--bad); font-weight: 700; }
  .tab tr.click { cursor: pointer; }
  .tab tr.click:hover td { background: var(--bg); }
  .barras .b { display: grid; grid-template-columns: 110px 1fr 56px; gap: 8px; align-items: center; font-size: 14px; margin: 6px 0; }
  .barras .b span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barras .trilho { background: var(--line); border-radius: 99px; height: 12px; overflow: hidden; }
  .barras .trilho i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
  .barras .b b { text-align: right; }
  .duas { display: grid; gap: 0 14px; }
  @media (min-width: 1000px) { .duas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
  .sub-abas { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .sub-abas button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .sub-abas button.on { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* Usuários: tipo de acesso e permissões */
  .tipo-acesso { display: grid; gap: 8px; margin-bottom: 10px; }
  .opcao, .perm { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; color: var(--text); margin: 0; font-size: 15px; }
  .opcao input, .perm input { width: auto; margin: 3px 0 0; flex: none; }
  .opcao small, .perm small { display: block; color: var(--muted); font-size: 12px; }
  .opcao:has(input:checked) { border-color: var(--primary); background: var(--primary-2); }
  .perms { display: grid; gap: 6px; margin-bottom: 8px; }
  @media (min-width: 600px) { .perms { grid-template-columns: 1fr 1fr; } }
  .perm { padding: 8px 10px; font-size: 14px; }
  .perm:has(input:checked) { border-color: var(--primary); }

  /* Metas, pausas, itens */
  .barra-prog { display: flex; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 6px; }
  .barra-prog i { display: block; height: 100%; }
  .caixa-itens { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; font-size: 14px; }
  .pausa-tag { display: inline-flex; align-items: center; gap: 4px; background: var(--warn-bg); color: var(--warn); border-radius: 99px; padding: 2px 4px 2px 10px; margin: 2px 0; }
  .pausa-tag button { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 12px; }
  .marca-meta { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--text); border-radius: 2px; transform: translateX(-1px); }
  .barras .trilho { position: relative; overflow: visible; }
  .barras .trilho i { border-radius: 99px; }
  .pl-in { width: 90px; margin: 0; padding: 6px 8px; text-align: right; }
  #hBtns button.sino-on { background: #ffd54a; color: #3a2a00; font-weight: 700; }
  @media (max-width: 999px) { .so-pc { display: none !important; } }

  /* Modo TV (telão) */
  body.tv header, body.tv .demo-bar, body.tv .menu { display: none !important; }
  body.tv { background: #0b1117; }
  body.tv main, body.tv main.largo { max-width: none; padding: 0; }
  .tv-tela { min-height: 100vh; background: #0b1117; color: #e8edf3; padding: 18px 24px 24px; font-size: 18px; }
  .tv-topo { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .tv-topo b { font-size: 28px; display: block; }
  .tv-topo span { color: #93a1b3; font-size: 18px; text-transform: capitalize; }
  .tv-hora { font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tv-sair { background: transparent; border: 1px solid #2a3542; color: #93a1b3; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .tv-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .tv-kpis > div { background: #18202a; border-radius: 16px; padding: 14px 18px; }
  .tv-kpis span { color: #93a1b3; font-size: 16px; display: block; }
  .tv-kpis b { font-size: 48px; line-height: 1.1; display: block; }
  .tv-kpis small { color: #93a1b3; font-size: 16px; }
  .tv-grupo { margin-bottom: 14px; }
  .tv-gtit { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #93a1b3; margin: 6px 0 8px; display: flex; gap: 14px; }
  .tv-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .tv-local { background: #18202a; border-radius: 14px; padding: 12px 14px; border-left: 6px solid #2a3542; }
  .tv-local.st-azul { border-left-color: #4c8dff; } .tv-local.st-ok { border-left-color: #4fc26a; } .tv-local.st-warn { border-left-color: #e3b341; }
  .tv-l1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .tv-l1 b { font-size: 22px; }
  .tv-pess { color: #93a1b3; font-size: 15px; min-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tv-l3 { display: flex; justify-content: space-between; font-size: 15px; }
  .tv-tela .barra-prog { background: #2a3542; }
  .tv-tela .pill.off { background: #2a3542; color: #93a1b3; }

  /* Impressão: só o relatório, sem o endereço do site nas bordas */
  .so-print { display: none; }
  @page rel { size: A4 landscape; margin: 0; }
  @media print {
    header, .menu, .no-print, .toast, .sub-abas, .filtros, .navdia { display: none !important; }
    .so-print { display: block; }
    body { background: #fff; color: #111; }
    main, main.largo { max-width: none; padding: 0 12mm !important; }
    .painel { display: block !important; }
    #aba { page: rel; padding-top: 10mm; }
    .card, .kpi { border: 1px solid #ccc; break-inside: avoid; }
    .tabela-wrap { overflow: visible; }
    .tab th, .tab td { padding: 4px 6px; font-size: 11px; }
    .kpis { grid-template-columns: repeat(4, 1fr) !important; }
  }
</style>
</head>
<body>
<header>
  <h1 id="hTitle">📋 Controle de Atividades</h1>
  <div id="hBtns"></div>
</header>
<main id="app"><div class="empty">Carregando…</div></main>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
<script>
  // Se o app não iniciar (ex.: primeira abertura sem internet), mostra um aviso
  setTimeout(function () {
    if (!window.__ativOk) document.getElementById("app").innerHTML =
      '<div class="card center"><h2>Não foi possível abrir o app</h2><p class="muted">Na primeira vez é preciso estar com internet. Conecte-se e recarregue a página.</p><button class="btn" onclick="location.reload()">Recarregar</button></div>';
  }, 12000);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
</body>
</html>
